name: Windows release builds

# Builds, tests and smoke-tests both Windows packages (x64 for Intel/AMD PCs and arm64 for Snapdragon/ARM PCs), then zips each only if every check passed.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Describe the runner desktop
        shell: pwsh
        run: |
          "Processor: $env:PROCESSOR_ARCHITECTURE"
          "Identifier: $env:PROCESSOR_IDENTIFIER"
          "Session: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId)"
          Get-Process -Name explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId | Format-Table

      - name: Install build tools
        run: node tools/build.mjs setup

      - name: Unit tests
        run: node tools/build.mjs test

      - name: Package ${{ matrix.arch }}
        run: node tools/build.mjs package --arch=${{ matrix.arch }}

      # A runner has no signed-in Codex account, so the smoke reads quota from a local stand-in that the receipt names.
      - name: Build the Codex stand-in
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'codex-standin'
          New-Item -ItemType Directory -Force $dir | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /platform:x64 "/out:$dir\codex.exe" tools\codex-standin.cs
          if ($LASTEXITCODE -ne 0) { throw "The C# compiler failed with exit $LASTEXITCODE" }
          & "$dir\codex.exe" --version
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      # A runner has never run Claude Code either; CLAUDE_CONFIG_DIR points Limiter at a small sample log instead.
      - name: Write the Claude Code sample
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude-fixture'
          node tools/ci-claude-fixture.mjs
          if ($LASTEXITCODE -ne 0) { throw "The Claude sample failed with exit $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_ENV -Value "CLAUDE_CONFIG_DIR=$env:CLAUDE_CONFIG_DIR"

      - name: Packaged smoke test
        shell: pwsh
        run: |
          $helper = Start-Process -FilePath pwsh -ArgumentList '-NoProfile', '-File', 'tools/keep-active.ps1' -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 3
            node tools/packaged-smoke.mjs --arch=${{ matrix.arch }}
            if ($LASTEXITCODE -ne 0) { throw "Packaged smoke failed with exit $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $helper.Id -ErrorAction SilentlyContinue
          }

      - name: Zip the tested package
        run: node tools/make-release.mjs --arch=${{ matrix.arch }}

      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          $build = Join-Path $env:LOCALAPPDATA 'Limiter-build'
          New-Item -ItemType Directory -Force out | Out-Null
          if (Test-Path (Join-Path $build 'dist')) { Copy-Item (Join-Path $build 'dist\*') out }
          if (Test-Path (Join-Path $build 'smoke\${{ matrix.arch }}')) {
            Get-ChildItem (Join-Path $build 'smoke\${{ matrix.arch }}') -Recurse -Filter receipt.json | ForEach-Object { Copy-Item $_.FullName (Join-Path out ('smoke-' + $_.Directory.Name + '.json')) }
          }
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: limiter-windows-${{ matrix.arch }}
          path: out/
          if-no-files-found: warn
