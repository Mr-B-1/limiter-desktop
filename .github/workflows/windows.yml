name: Windows x64 build

# Builds, tests and smoke-tests the x64 package on a real x64 Windows runner, then zips it only if every check passed.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  x64:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Describe the runner desktop
        shell: pwsh
        run: |
          "Processor: $env:PROCESSOR_ARCHITECTURE"
          "Session: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId)"
          Get-Process -Name explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId | Format-Table

      - name: Install build tools
        run: node tools/build.mjs setup

      - name: Unit tests
        run: node tools/build.mjs test

      - name: Package x64
        run: node tools/build.mjs package --arch=x64

      - name: Packaged smoke test
        shell: pwsh
        run: |
          $helper = Start-Process -FilePath pwsh -ArgumentList '-NoProfile', '-File', 'tools/keep-active.ps1' -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 3
            node tools/packaged-smoke.mjs --arch=x64
            if ($LASTEXITCODE -ne 0) { throw "Packaged smoke failed with exit $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $helper.Id -ErrorAction SilentlyContinue
          }

      - name: Zip the tested package
        run: node tools/make-release.mjs --arch=x64

      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          $build = Join-Path $env:LOCALAPPDATA 'Limiter-build'
          New-Item -ItemType Directory -Force out | Out-Null
          if (Test-Path (Join-Path $build 'dist')) { Copy-Item (Join-Path $build 'dist\*') out }
          if (Test-Path (Join-Path $build 'smoke\x64')) {
            Get-ChildItem (Join-Path $build 'smoke\x64') -Recurse -Filter receipt.json | ForEach-Object { Copy-Item $_.FullName (Join-Path out ('smoke-' + $_.Directory.Name + '.json')) }
          }
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: limiter-windows-x64
          path: out/
          if-no-files-found: warn
